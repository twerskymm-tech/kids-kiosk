name: Build the app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      # The app's signing key is made once and kept in the Actions cache (not in the repo),
      # so each new version installs over the old one.
      - uses: actions/cache@v4
        with:
          path: ~/.kiosk-signing
          key: kiosk-signing-v1

      - name: Signing key
        run: |
          mkdir -p ~/.kiosk-signing
          if [ ! -f ~/.kiosk-signing/kiosk.keystore ]; then
            openssl rand -hex 16 > ~/.kiosk-signing/password
            keytool -genkeypair -keystore ~/.kiosk-signing/kiosk.keystore -alias kiosk -keyalg RSA -keysize 2048 -validity 12000 \
              -storepass "$(cat ~/.kiosk-signing/password)" -keypass "$(cat ~/.kiosk-signing/password)" -dname "CN=Kids Home"
          fi
          echo "KIOSK_KEYSTORE=$HOME/.kiosk-signing/kiosk.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$(cat ~/.kiosk-signing/password)"
          echo "KIOSK_KEYSTORE_PASSWORD=$(cat ~/.kiosk-signing/password)" >> "$GITHUB_ENV"

      - name: Build the app
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk kids-home.apk

      - uses: actions/upload-artifact@v5
        with:
          name: kids-home
          path: kids-home.apk

      - name: Publish as the latest download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest kids-home.apk \
            --title "Kids Home $VERSION" \
            --notes "Download kids-home.apk below, then follow the setup guide in the README." \
            --latest
